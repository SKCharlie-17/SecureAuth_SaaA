
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "secureauth"
version = "0.1.0"
description = "A modular authentication library with face recognition, QR credentials, and password fallback."
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "numpy",
    "opencv-python",
    "pymongo"
]

[project.optional-dependencies]
flask = [
    "Flask>=3.0"
]

[tool.setuptools.packages.find]
include = ["secureauth*"]
exclude = [
    "tests*",
    "test*",
    "server*",
    "src*"
]

[tool.setuptools.package-data]
secureauth = ["models/*.onnx"]
